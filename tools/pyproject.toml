[project]
name = "commitmono-tools"
version = "0.1.0"
description = "Extract, rebuild, verify and proof the Commit Mono font binaries"
requires-python = ">=3.15"
dependencies = [
    "defcon>=0.12.2",
    "fontmake>=3.12.1",
    "fonttools[unicode,woff]>=4.65.0",
    "ufo-extractor>=0.8.1",
    "uharfbuzz>=0.56.1",
]

[project.scripts]
cmfont = "commitmono_tools.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commitmono_tools"]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: extracts and rebuilds fonts, takes minutes"]
